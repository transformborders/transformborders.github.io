<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12372a">
  <title>Transform Borders</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12372a;
      color: #f5f7f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      background: #12372a;
    }

    h1 {
      max-width: 18ch;
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 5.5rem);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Transform Borders!</h1>
  </main>
</body>
</html>
